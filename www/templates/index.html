<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Weylus</title>
    <link rel="stylesheet" href="style.css">
    <script src="lib.js"></script>
    <script>
        run("{{log_level}}");
    </script>
</head>

<body>
    <main id="main">
        <video id="video" autoplay muted defaultMuted playsinline disablePictureInPicture></video>
        <canvas id="canvas" class="vanish"></canvas>
        <div id="debug_overlay" class="hide"></div>
    </main>
    <div id="settings">
        <div id="handle">⠿</div>
        <div id="settings_scroll">
            <h2>Settings</h2>
            <section>
                <label for="window">Capture:</label>
                <select id="window"></select>
                <button id="refresh">Refresh List</button>
            </section>
            <h3>Video</h3>
            <section>
                <label><input type="checkbox" id="enable_video" checked /> <span>Enable Video</span></label>
                <label><input type="checkbox" id="energysaving" /> <span>Energy Saving (no video, black
                        screen)</span></label>
                <label><input type="checkbox" id="stretch" checked /> <span>Stretch Video</span></label>
                <button id="fullscreen">Toggle Fullscreen</button>
                <label {{#if (not capture_cursor_enabled)}}class="hide" {{/if}}>
                    <input type="checkbox" id="capture_cursor" />
                    <span>Capture Cursor</span>
                </label>
                <label><input type="checkbox" id="aggressive_seeking" checked /> <span>Lower Latency<br>(possibly
                        choppy)</span></label>
                <label>Max Video Resolution: <br><input type="range" id="scale_video" min="0.1" max="2" step="0.01"
                        value="1.8" /><output></output></label>
                <label>Frame Rate: <br><input type="range" id="frame_rate" value="0" /><output>30</output> fps</label>
            </section>
            <h3>Input</h3>
            <section>
                <label><input type="checkbox" id="enable_mouse" checked /> <span>Enable Mouse</span></label>
                <label><input type="checkbox" id="enable_stylus" checked /> <span>Enable Stylus</span></label>
                <label><input type="checkbox" id="enable_touch" checked /> <span>Enable Touch</span></label>
                <fieldset id="touchpad_options">
                    <legend><label><input type="checkbox" id="touchpad_mode" /> <span>Touchpad Mode</span></label></legend>
                    <p class="setting_hint">Use the screen like a laptop touchpad. These controls are saved on this device.</p>
                    <label><input type="checkbox" id="touchpad_tap_to_click" checked /> <span>Tap to click</span></label>
                    <label><input type="checkbox" id="touchpad_double_tap_drag" checked /> <span>Double-tap and drag</span></label>
                    <label><input type="checkbox" id="touchpad_two_finger_scroll" checked /> <span>Two-finger scrolling</span></label>
                    <label><input type="checkbox" id="touchpad_reverse_scroll" /> <span>Reverse scroll direction</span></label>
                    <label><input type="checkbox" id="touchpad_two_finger_tap" checked /> <span>Two-finger tap = right click</span></label>
                    <label><input type="checkbox" id="touchpad_three_finger_tap" checked /> <span>Three-finger tap = middle click</span></label>

                    <div class="touchpad_range">
                        <label for="touchpad_sensitivity">Cursor sensitivity</label>
                        <input type="range" id="touchpad_sensitivity" min="0.25" max="3" step="0.05" value="1" />
                        <output>1.00x</output>
                    </div>
                    <div class="touchpad_range">
                        <label for="touchpad_scroll_sensitivity">Scroll sensitivity</label>
                        <input type="range" id="touchpad_scroll_sensitivity" min="0.25" max="4" step="0.05" value="1" />
                        <output>1.00x</output>
                    </div>
                    <div class="touchpad_range">
                        <label for="touchpad_tap_duration">Maximum tap time</label>
                        <input type="range" id="touchpad_tap_duration" min="80" max="600" step="10" value="200" />
                        <output>200 ms</output>
                    </div>
                    <div class="touchpad_range">
                        <label for="touchpad_double_tap_interval">Time between double taps</label>
                        <input type="range" id="touchpad_double_tap_interval" min="100" max="800" step="10" value="300" />
                        <output>300 ms</output>
                    </div>
                    <div class="touchpad_range">
                        <label for="touchpad_movement_tolerance">Tap movement tolerance</label>
                        <input type="range" id="touchpad_movement_tolerance" min="2" max="30" step="1" value="8" />
                        <output>8 px</output>
                    </div>
                    <div class="touchpad_range">
                        <label for="touchpad_double_tap_distance">Double-tap distance</label>
                        <input type="range" id="touchpad_double_tap_distance" min="5" max="80" step="1" value="25" />
                        <output>25 px</output>
                    </div>
                    <button type="button" id="reset_touchpad">Reset touchpad defaults</button>
                </fieldset>
                <label {{#if (not uinput_enabled)}}class="hide" {{/if}}>
                    <input type="checkbox" id="uinput_support" checked />
                    <span>Enable uinput</span>
                </label>
                <label>Min pressure to generate: <br><input type="range" id="min_pressure" min="0" max="1" step="0.01"
                        value="0" /></label>
                <button id="custom_input_areas" {{#if (not enable_custom_input_areas)}}class="hide" {{/if}}>Custom Input
                    Area</button>
                <label {{#if (not enable_custom_input_areas)}}class="hide" {{/if}}><input type="checkbox"
                        id="enable_custom_input_areas" /> <span>Enable Custom Input
                        Area</span></label>
            </section>
            <section {{#if (not uinput_enabled)}}class="hide" {{/if}}>
                <label><span>Client Name:</span><br><input type="text" id="client_name" /><br><span>Optional, useful to
                        distinguish multiple devices.</span></label>
            </section>
            <section id="displayoptions">
                <label id="leftylabel"><input type="checkbox" id="lefty" />Swap</label>
                <label id="vanish">Hide until Reload</label>
            </section>
            <section id="stats_section">
                <label><span>FPS (receiving): </span><output id="fps">0</output></label>
            </section>
            <section id="debug_section">
                <label><input type="checkbox" id="enable_debug_overlay" /> <span>Debug
                        Overlay</span></label>
            </section>
            <section id="log_section" class="hide">
                <label>Log
                    <pre class="log" id="log" />
                </label>
            </section>
        </div>
    </div>
</body>

</html>
